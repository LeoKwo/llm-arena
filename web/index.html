<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM Arena</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --muted: #8b93a5;
    --accent: #6ea8fe;
    --danger: #ff6b6b;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
  .turn-badge {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }
  .status { color: var(--muted); }
  .status.running { color: var(--accent); }
  .status.done { color: var(--ok); }
  .status.error { color: var(--danger); }
  header .spacer { flex: 1; }
  input[type="number"] {
    width: 64px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  button {
    background: var(--accent);
    color: #0b1220;
    border: 0;
    border-radius: 6px;
    padding: 7px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.btn-stop { background: var(--danger); color: #fff; }
  button.btn-lang {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
    min-width: 52px;
  }
  main {
    display: grid;
    grid-template-columns: minmax(420px, 1fr) minmax(360px, 460px);
    gap: 16px;
    padding: 16px 20px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .toggle-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; }
  .model-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .model-cell { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .model-cell label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .model-cell .nation-name { font-weight: 700; color: var(--text); }
  select {
    width: 100%;
    background: #0b0e13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .keywarn { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 16px; }
  .keys { margin-top: 12px; display: grid; gap: 8px; }
  .keys > summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .key-row { display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 8px; }
  .key-row > label { font-size: 12px; color: var(--muted); }
  .key-input { display: flex; gap: 6px; }
  .key-input input {
    flex: 1;
    background: #0b0e13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  .btn-ghost {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-weight: 500;
    font-size: 12px;
  }
  .key-badge { font-size: 11px; color: var(--muted); min-width: 52px; text-align: right; }
  .key-badge.ok { color: var(--ok); }
  .key-badge.miss { color: var(--danger); }
  .nations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .nation {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--nc, var(--accent));
    border-radius: 8px;
    padding: 12px;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .nation.thinking { box-shadow: 0 0 0 2px var(--nc, var(--accent)); animation: pulse 1.2s infinite; }
  .nation.eliminated { opacity: 0.45; filter: grayscale(0.6); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 2px transparent; } }
  .nation .name { font-weight: 700; }
  .nation .model { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .stat { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; }
  .bar { height: 6px; background: #0b0e13; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar > span { display: block; height: 100%; background: var(--nc, var(--accent)); }
  .terr { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    background: #0b0e13;
    border: 1px solid var(--border);
  }
  .goals { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .goals li { margin: 2px 0; }
  .hexmap {
    width: 100%;
    height: auto;
    max-height: 560px;
    display: block;
    margin-top: 4px;
    background: #0b0e13;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: grab;
    touch-action: none;
  }
  .hexmap:active { cursor: grabbing; }
  .hexmap polygon { transition: filter 0.1s; }
  .hexmap polygon:hover { filter: brightness(1.5); }
  .hexmap polygon.sel { stroke: #fff; stroke-width: 2; }
  .hexinfo {
    margin-top: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    min-height: 34px;
    color: var(--muted);
  }
  .hexinfo b { color: var(--text); }
  .map-tools { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .map-tools .hint { flex: 1; }
  body.spectate .setup-panel { display: none; }
  body.spectate main {
    grid-template-columns: 1fr 440px;
    height: calc(100vh - 57px);
    align-items: stretch;
  }
  body.spectate main > section { display: flex; flex-direction: column; min-height: 0; }
  body.spectate .map-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  body.spectate .hexmap { flex: 1; max-height: none; height: 100%; min-height: 0; }
  body.spectate .feed-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body.spectate .log { height: auto; flex: 1; min-height: 0; }
  button.btn-ghost.active { background: var(--accent); color: #0b1220; }
  .relations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .rel { background: #0b0e13; border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; font-size: 11px; }
  .rel b { display: block; font-size: 13px; }
  .log {
    height: calc(100vh - 130px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .entry {
    border-left: 3px solid var(--border);
    padding: 6px 10px;
    background: var(--panel-2);
    border-radius: 0 6px 6px 0;
    font-size: 13px;
  }
  .entry .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .entry .who { font-weight: 700; }
  .entry .prov { color: var(--muted); font-size: 11px; }
  .entry .act { color: var(--accent); font-weight: 600; }
  .entry .res { color: var(--muted); margin-top: 2px; }
  .entry .detail { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: pre-wrap; }
  .entry.turn { border-left-color: var(--accent); font-weight: 700; }
  .entry.system { border-left-color: var(--ok); }
  .entry.error { border-left-color: var(--danger); color: var(--danger); }
  .think {
    border-left: 3px solid var(--border);
    background: #12151b;
    border-radius: 0 6px 6px 0;
    padding: 4px 10px;
  }
  .think > summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    list-style: none;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .think > summary::-webkit-details-marker { display: none; }
  .think .who { font-weight: 700; }
  .think .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); display: inline-block;
    animation: pulse 1.2s infinite;
  }
  .think .count { margin-left: auto; color: var(--muted); }
  .think .think-body {
    white-space: pre-wrap;
    font-size: 12px;
    color: #c8cede;
    margin-top: 6px;
    max-height: 260px;
    overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .final { text-align: center; }
  .final .winner { font-size: 22px; font-weight: 800; margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>LLM Arena</h1>
  <div class="turn-badge"><span data-i18n="turn">Turn</span> <span id="turn">-</span></div>
  <div id="status" class="status" data-i18n="status_idle">idle</div>
  <div class="spacer"></div>
  <button id="spectate" class="btn-lang" type="button" data-i18n="spectator">Spectator</button>
  <button id="langtoggle" class="btn-lang" type="button">中文</button>
  <label><span data-i18n="max_turns">Max turns</span> <input id="maxturns" type="number" value="10" min="1" max="100" /></label>
  <button id="start" data-i18n="start">Start</button>
  <button id="stop" class="btn-stop" disabled data-i18n="interrupt">Interrupt</button>
</header>

<main>
  <section>
    <div class="panel setup-panel">
      <h2 data-i18n="models">Models</h2>
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="useapi" />
          <span data-i18n="use_api">Use API models</span>
        </label>
        <span class="hint" id="modeltogglehint" data-i18n="model_hint_off">Off = local Ollama models. On = cloud API providers.</span>
      </div>
      <div class="model-grid" id="modelgrid"></div>
      <details class="keys" id="keysbox" open>
        <summary data-i18n="api_keys">API Keys</summary>
        <div class="keys" id="apikeys"></div>
        <span class="hint" data-i18n="api_keys_hint">Keys are kept in this local server's memory and never written to disk.</span>
      </details>
      <div class="keywarn" id="keywarn"></div>
    </div>

    <div class="panel setup-panel" style="margin-top:16px">
      <h2 data-i18n="nations">Nations</h2>
      <div class="nations" id="nations"></div>
    </div>
    <div class="panel map-panel" style="margin-top:16px">
      <h2 data-i18n="world_map">World Map</h2>
      <svg class="hexmap" id="hexmap" role="img"></svg>
      <div class="map-tools">
        <button id="mapreset" class="btn-ghost" type="button" data-i18n="reset_view">Reset view</button>
        <span class="hint" data-i18n="map_hint">Drag to pan, scroll to zoom, click a hex for details.</span>
      </div>
      <div class="hexinfo" id="hexinfo" data-i18n="hex_info_empty">Click a hex to inspect.</div>
      <h2 style="margin-top:14px" data-i18n="relations">Relations</h2>
      <div class="relations" id="relations"></div>
    </div>
  </section>

  <section class="panel feed-panel">
    <h2 data-i18n="live_feed">Live Feed</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
const PALETTE = ["#e06c75", "#61afef", "#98c379", "#e5c07b", "#c678dd", "#56b6c2"];
const NATION_COLORS = {};
const SLUGS = [["germany", "Germany"], ["france", "France"], ["uk", "United Kingdom"]];
let providerInfo = null;
let localDefaults = {};
let apiDefaults = {};
let envDefaults = {};
let source = null;
const nationEls = {};
const liveThink = {};
let scrollPending = false;

const el = (id) => document.getElementById(id);

const I18N = {
  en: {
    turn: "Turn",
    max_turns: "Max turns",
    start: "Start",
    interrupt: "Interrupt",
    models: "Models",

    status_error: "error",

    key_hide: "Hide",

    key_placeholder: "paste API key",
    badge_ui: "in UI",
    badge_env: "env",

    node_reflect: "reflecting",
    node_act: "acting",
    sim_started: (n) => `Simulation started (max ${n} turns).`,
    turn_n: (n) => `Turn ${n}`,
    reason: (r) => `reason: ${r}`,

    keys_save_failed: (m) => `Could not save API keys: ${m}`,

      `Missing API key for: ${list}. Paste it above or set the env var before running.`,
  },
  zh: {
    turn: "回合",
    max_turns: "最大回合",
    start: "开始",
    interrupt: "中断",
    models: "模型",
    use_api: "使用 API 模型",
    model_hint_off: "关闭 = 本地 Ollama 模型；开启 = 云端 API 提供商。",
    model_hint_on: "开启 = 每个国家可分别选择云端提供商。",
    api_keys: "API 密钥",
    api_keys_hint: "密钥仅保存在本地服务端内存中，不会写入磁盘。",
    nations: "国家",
    world_map: "世界地图",
    relations: "外交关系",
    live_feed: "实时动态",
    resources: "资源",
    cities: "城市数",
    units: "单位数",
    score: "得分",
    goal_progress: "目标进度",

    act_spawn_unit: "生成单位",
    act_move_unit: "行军",
    act_attack_city: "攻城",
    act_claim_tile: "占领空地",
    act_garrison: "驻扎",
    act_end_turn: "结束回合",
    spectator: "观战模式",
    exit_spectate: "退出观战",
    reset_view: "重置视图",
    map_hint: "拖拽平移，滚轮缩放，点击六边形查看详情。",
    hex_info_empty: "点击六边形查看详情。",
    label_owner: "归属",
    label_resources: "资源",
    label_terrain: "地形",
    label_units: "单位",
    terrain_city: "城市",
    terrain_land: "陆地",
    neutral: "中立",
    status_idle: "空闲",
    status_running: "运行中",
    status_connecting: "连接中…",
    status_stopping: "正在停止…",
    status_interrupted: "已中断",
    status_finished: "已结束",
    status_error: "错误",
    key_show: "显示",
    key_hide: "隐藏",
    key_placeholder_env: "已由环境变量配置 — 留空即可使用",
    key_placeholder: "粘贴 API 密钥",
    badge_ui: "界面填入",
    badge_env: "环境变量",
    badge_missing: "缺失",
    key_missing_suffix: " — 缺少密钥",
    node_plan: "规划中",
    node_reflect: "反思中",
    node_act: "行动中",
    sim_started: (n) => `模拟开始（最多 ${n} 回合）。`,
    turn_n: (n) => `回合 ${n}`,
    reason: (r) => `理由：${r}`,
    sim_interrupted: "模拟已被用户中断。",
    sim_ended: "模拟结束",
    no_winner: "无胜者",
    eliminated: "（已淘汰）",
    keys_save_failed: (m) => `无法保存 API 密钥：${m}`,
    missing_key: (list) =>
      `缺少以下提供商的 API 密钥：${list}。请在上方填写，或先设置环境变量再运行。`,
  },
};

let lang = "en";

function t(key, ...args) {
  const table = I18N[lang] || I18N.en;
  const entry = table[key] !== undefined ? table[key] : I18N.en[key];
  if (entry === undefined) return key;
  return typeof entry === "function" ? entry(...args) : entry;
}

let lastNations = null;
let lastWorld = null;
let currentStatus = { key: "status_idle", cls: "" };

function colorFor(name) {
  if (!NATION_COLORS[name]) {
    NATION_COLORS[name] = PALETTE[Object.keys(NATION_COLORS).length % PALETTE.length];
  }
  return NATION_COLORS[name];
}

function applyStatus() {
  const s = el("status");
  if (!s) return;
  s.textContent = t(currentStatus.key);
  s.className = "status " + (currentStatus.cls || "");
}

function setStatus(key, cls) {
  currentStatus = { key, cls: cls || "" };
  applyStatus();
}

function applyI18n() {
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    node.textContent = t(node.getAttribute("data-i18n"));
  });
  const toggle = el("langtoggle");
  if (toggle) toggle.textContent = lang === "en" ? "中文" : "EN";
  const spec = el("spectate");
  if (spec) {
    spec.textContent = document.body.classList.contains("spectate")
      ? t("exit_spectate")
      : t("spectator");
  }
  refreshDynamicI18n();
}

function refreshDynamicI18n() {
  if (providerInfo) {
    Object.keys(providerInfo).forEach((provider) => {
      if (provider === "ollama") return;
      const input = el("key-" + provider);
      const btn = document.querySelector(`[data-toggle="${provider}"]`);
      if (input) {
        input.placeholder = providerInfo[provider].configured
          ? t("key_placeholder_env")
          : t("key_placeholder");
      }
      if (btn) btn.textContent = input && input.type === "text" ? t("key_hide") : t("key_show");
    });
    refreshOptionLabels();
    updateKeyBadges();
    updateKeyWarning();
  }
  const hint = el("modeltogglehint");
  const useapi = el("useapi");
  if (hint && useapi) {
    hint.textContent = useapi.checked ? t("model_hint_on") : t("model_hint_off");
  }
  if (lastNations) renderNations(lastNations, lastWorld);
  applyStatus();
}

function setRunning(running) {
  el("start").disabled = running;
  el("stop").disabled = !running;
}

function clearLog() {
  el("log").innerHTML = "";
  Object.keys(liveThink).forEach((k) => delete liveThink[k]);
}

function log(html, cls) {
  const div = document.createElement("div");
  div.className = "entry " + (cls || "");
  div.innerHTML = html;
  const box = el("log");
  box.appendChild(div);
  scrollLog();
}

const NODE_LABEL_KEYS = { plan: "node_plan", reflect: "node_reflect", act: "node_act" };

function nodeLabel(node) {
  return t(NODE_LABEL_KEYS[node] || node);
}

function scrollLog() {
  if (scrollPending) return;
  scrollPending = true;
  requestAnimationFrame(() => {
    const box = el("log");
    box.scrollTop = box.scrollHeight;
    scrollPending = false;
  });
}

function startThink(agent, node) {
  const key = agent + "|" + node;
  const color = colorFor(agent);
  const details = document.createElement("details");
  details.className = "think";
  details.open = true;
  const label = nodeLabel(node);
  details.innerHTML =
    `<summary><span class="dot"></span>` +
    `<span class="who" style="color:${color}">${agent}</span>` +
    `<span>${label}...</span><span class="count"></span></summary>` +
    `<div class="think-body"></div>`;
  el("log").appendChild(details);
  const obj = {
    root: details,
    body: details.querySelector(".think-body"),
    summary: details.querySelector("summary"),
    count: details.querySelector(".count"),
    node,
    text: "",
  };
  liveThink[key] = obj;
  scrollLog();
  return obj;
}

function appendThink(agent, node, text) {
  const key = agent + "|" + node;
  let obj = liveThink[key];
  if (!obj) obj = startThink(agent, node);
  obj.text += text;
  obj.body.textContent += text;
  obj.count.textContent = obj.text.length + " chars";
  scrollLog();
}

function endThink(agent, node) {
  const key = agent + "|" + node;
  const obj = liveThink[key];
  if (!obj) return;
  delete liveThink[key];
  if (obj.text.trim().length === 0) {
    obj.root.remove();
    return;
  }
  obj.root.open = false;
  const label = nodeLabel(node);
  obj.summary.innerHTML =
    `<span class="who" style="color:${colorFor(agent)}">${agent}</span>` +
    `<span>${label} (${obj.text.length} chars)</span>`;
}

async function loadProviders() {
  try {
    const data = await (await fetch("/api/providers")).json();
    providerInfo = data.providers;
    localDefaults = data.defaults.local || {};
    apiDefaults = data.defaults.api || {};
    envDefaults = data.defaults.env || {};
  } catch (err) {
    providerInfo = { ollama: { label: "Local (Ollama)", configured: true } };
  }
  buildModelGrid();
  buildApiKeyFields();
  applyEnvDefaults();
  updateKeyWarning();
}

function applyEnvDefaults() {
  if (!providerInfo || !envDefaults) return;
  SLUGS.forEach(([slug, nation]) => {
    const conf = envDefaults[nation];
    const select = el("sel-" + slug);
    if (!select || !conf || !conf.provider) return;
    if (providerInfo[conf.provider]) select.value = conf.provider;
  });
}

function buildApiKeyFields() {
  const box = el("apikeys");
  if (!box) return;
  box.innerHTML = "";
  if (!providerInfo) return;
  Object.entries(providerInfo)
    .filter(([key]) => key !== "ollama")
    .forEach(([key, info]) => {
      const row = document.createElement("div");
      row.className = "key-row";
      row.innerHTML =
        `<label>${info.label}</label>` +
        `<div class="key-input">` +
        `<input type="password" data-provider="${key}" id="key-${key}" autocomplete="off" spellcheck="false" ` +
        `placeholder="${info.configured ? t("key_placeholder_env") : t("key_placeholder")}">` +
        `<button type="button" class="btn-ghost" data-toggle="${key}">${t("key_show")}</button>` +
        `</div>` +
        `<span class="key-badge" id="badge-${key}"></span>`;
      box.appendChild(row);
      const input = row.querySelector("input");
      input.addEventListener("input", () => { updateKeyBadges(); updateKeyWarning(); });
      row.querySelector("button").addEventListener("click", () => {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        row.querySelector("button").textContent = showing ? t("key_show") : t("key_hide");
      });
    });
  updateKeyBadges();
}

function hasUiKey(provider) {
  const input = el("key-" + provider);
  return !!(input && input.value.trim());
}

function apiKeyReady(provider) {
  if (hasUiKey(provider)) return true;
  return !!(providerInfo && providerInfo[provider] && providerInfo[provider].configured);
}

function updateKeyBadges() {
  if (!providerInfo) return;
  Object.keys(providerInfo).forEach((provider) => {
    if (provider === "ollama") return;
    const badge = el("badge-" + provider);
    if (!badge) return;
    let text = t("badge_missing");
    let cls = "key-badge miss";
    if (hasUiKey(provider)) { text = t("badge_ui"); cls = "key-badge ok"; }
    else if (providerInfo[provider].configured) { text = t("badge_env"); cls = "key-badge ok"; }
    badge.textContent = text;
    badge.className = cls;
  });
}

function collectApiKeys() {
  const keys = {};
  if (!providerInfo) return keys;
  Object.keys(providerInfo).forEach((provider) => {
    if (provider === "ollama") return;
    const input = el("key-" + provider);
    keys[provider] = input ? input.value.trim() : "";
  });
  return keys;
}

function optionList(selected) {
  return Object.entries(providerInfo).map(([key, info]) => {
    const label = info.label + (info.configured === false ? t("key_missing_suffix") : "");
    return `<option value="${key}" ${key === selected ? "selected" : ""}>${label}</option>`;
  }).join("");
}

function buildModelGrid() {
  const grid = el("modelgrid");
  grid.innerHTML = "";
  SLUGS.forEach(([slug, nation]) => {
    const cell = document.createElement("div");
    cell.className = "model-cell";
    cell.innerHTML = `<label><span class="nation-name">${nation}</span></label>
      <select id="sel-${slug}" data-slug="${slug}"></select>`;
    grid.appendChild(cell);
    const select = cell.querySelector("select");
    select.innerHTML = optionList("ollama");
    select.addEventListener("change", updateKeyWarning);
  });
  applyToggle();
}

function applyToggle() {
  const useApi = el("useapi").checked;
  SLUGS.forEach(([slug, nation]) => {
    const select = el("sel-" + slug);
    if (!select) return;
    const value = useApi ? (apiDefaults[nation] || "qwen") : "ollama";
    select.value = value;
  });
  el("modeltogglehint").textContent = useApi
    ? t("model_hint_on")
    : t("model_hint_off");
}

function refreshOptionLabels() {
  if (!providerInfo) return;
  SLUGS.forEach(([slug]) => {
    const select = el("sel-" + slug);
    if (!select) return;
    Array.from(select.options).forEach((opt) => {
      const info = providerInfo[opt.value];
      if (!info) return;
      opt.textContent = info.label + (apiKeyReady(opt.value) ? "" : t("key_missing_suffix"));
    });
  });
}

function updateKeyWarning() {
  if (!providerInfo) return;
  refreshOptionLabels();
  const missing = [];
  const seen = new Set();
  SLUGS.forEach(([slug, nation]) => {
    const select = el("sel-" + slug);
    if (!select) return;
    const key = select.value;
    if (key === "ollama" || seen.has(key)) return;
    seen.add(key);
    if (!apiKeyReady(key)) {
      const info = providerInfo[key];
      missing.push(`${(info && info.label) || key} (${nation})`);
    }
  });
  el("keywarn").textContent = missing.length
    ? t("missing_key", missing.join(", "))
    : "";
}

const HEX_SIZE = 13;
const CITY_ABBR = {
  Stockholm: "Stock", Moscow: "Mosc", London: "Lond", Amsterdam: "Amst",
  Berlin: "Berl", Warsaw: "Wars", Paris: "Pari", Vienna: "Vien",
  Madrid: "Madr", Lisbon: "Lisb", Rome: "Rome", Athens: "Athe",
};

function hexToPixel(q, r) {
  const x = HEX_SIZE * 1.5 * q;
  const y = HEX_SIZE * Math.sqrt(3) * (r + q / 2);
  return [x, y];
}

function hexPoints(cx, cy, s) {
  // Flat-top hexes: vertices at 0/60/.../300 degrees, matching the
  // x = 1.5*s*q, y = sqrt(3)*s*(r + q/2) axial layout so edges tile exactly.
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 180) * (60 * i);
    pts.push(`${(cx + s * Math.cos(a)).toFixed(1)},${(cy + s * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(" ");
}

const mapView = { x: 0, y: 0, scale: 1 };

function applyMapTransform() {
  const layer = document.getElementById("hexlayer");
  if (layer) {
    layer.setAttribute(
      "transform",
      `translate(${mapView.x.toFixed(1)},${mapView.y.toFixed(1)}) scale(${mapView.scale.toFixed(3)})`
    );
  }
}

function svgPoint(evt) {
  const svg = el("hexmap");
  if (!svg || !svg.getScreenCTM) return null;
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function resetMapView() {
  mapView.x = 0;
  mapView.y = 0;
  mapView.scale = 1;
  applyMapTransform();
}

function showHexInfo(q, r) {
  const box = el("hexinfo");
  if (!box || !lastWorld) return;
  const tile = (lastWorld.tiles || []).find((x) => x.q === q && x.r === r);
  if (!tile) return;
  const units = (lastWorld.units || []).filter((u) => u.q === q && u.r === r);
  const name = tile.is_city ? tile.city : `(${tile.q},${tile.r})`;
  const terrain = tile.is_city ? t("terrain_city") : t("terrain_land");
  const owner = tile.owner ? `<b style="color:${colorFor(tile.owner)}">${tile.owner}</b>` : t("neutral");
  const unitText = units.length
    ? units
        .map(
          (u) =>
            `<b style="color:${colorFor(u.owner)}">${u.id}</b> ${u.owner} · res ${u.resources} · AP ${u.ap}`
        )
        .join("<br>")
    : "-";
  box.innerHTML =
    `<div><b>${name}</b> · ${terrain}</div>` +
    `<div>${t("label_owner")}: ${owner}</div>` +
    `<div>${t("label_resources")}: ${tile.resources}</div>` +
    `<div>${t("label_units")}:<br>${unitText}</div>`;
  const svg = el("hexmap");
  svg.querySelectorAll("polygon.sel").forEach((p) => p.classList.remove("sel"));
  const poly = svg.querySelector(`polygon[data-q="${q}"][data-r="${r}"]`);
  if (poly) poly.classList.add("sel");
}

function cityLabel(name) {
  return CITY_ABBR[name] || name;
}

function actionLabel(name) {
  const key = "act_" + name;
  const table = I18N[lang] || I18N.en;
  return table[key] !== undefined ? table[key] : name;
}

function renderHexMap(world) {
  const svg = el("hexmap");
  if (!svg) return;
  const tiles = world.tiles || [];
  if (!tiles.length) { svg.innerHTML = ""; return; }
  const pos = {};
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  tiles.forEach((tile) => {
    const [x, y] = hexToPixel(tile.q, tile.r);
    pos[tile.q + "," + tile.r] = [x, y];
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  });
  const pad = HEX_SIZE * 2;
  svg.setAttribute(
    "viewBox",
    `${minX - pad} ${minY - pad} ${maxX - minX + pad * 2} ${maxY - minY + pad * 2}`
  );

  const unitsByTile = {};
  (world.units || []).forEach((u) => {
    const k = u.q + "," + u.r;
    (unitsByTile[k] = unitsByTile[k] || []).push(u);
  });

  const parts = [];
  tiles.forEach((tile) => {
    const [x, y] = pos[tile.q + "," + tile.r];
    const ownerColor = tile.owner ? colorFor(tile.owner) : "#3a4150";
    const title =
      (tile.is_city ? tile.city : `(${tile.q},${tile.r})`) +
      ` · ${tile.owner || "neutral"} · ${tile.resources}`;
    if (tile.is_city) {
      parts.push(
        `<polygon class="hex" data-q="${tile.q}" data-r="${tile.r}" points="${hexPoints(x, y, HEX_SIZE)}" fill="${ownerColor}" stroke="#0b0e13" stroke-width="1.5"><title>${title}</title></polygon>`
      );
      parts.push(
        `<text x="${x}" y="${y - 1}" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">${cityLabel(tile.city)}</text>`
      );
      parts.push(
        `<text x="${x}" y="${y + 8}" text-anchor="middle" font-size="7" fill="#dfe3ea">${tile.resources}</text>`
      );
    } else {
      parts.push(
        `<polygon class="hex" data-q="${tile.q}" data-r="${tile.r}" points="${hexPoints(x, y, HEX_SIZE)}" fill="${ownerColor}" fill-opacity="${tile.owner ? 0.4 : 1}" stroke="#0b0e13" stroke-width="1"><title>${title}</title></polygon>`
      );
      if (tile.resources > 0) {
        parts.push(
          `<text x="${x}" y="${y + 3}" text-anchor="middle" font-size="7" fill="#8b93a5">${tile.resources}</text>`
        );
      }
    }
    const us = unitsByTile[tile.q + "," + tile.r] || [];
    us.forEach((u, i) => {
      const ox = (i - (us.length - 1) / 2) * 8;
      const uy = y + HEX_SIZE * 0.7;
      parts.push(
        `<circle cx="${x + ox}" cy="${uy}" r="6" fill="${colorFor(u.owner)}" stroke="#08090c" stroke-width="1"><title>${u.id} · ${u.owner} · res ${u.resources} · AP ${u.ap}</title></circle>`
      );
      parts.push(
        `<text x="${x + ox}" y="${uy + 2.5}" text-anchor="middle" font-size="6" font-weight="700" fill="#08090c">${u.resources}</text>`
      );
    });
  });
  svg.innerHTML =
    `<g id="hexlayer" transform="translate(${mapView.x.toFixed(1)},${mapView.y.toFixed(1)}) scale(${mapView.scale.toFixed(3)})">` +
    parts.join("") +
    `</g>`;
}

function renderNations(nations, world) {
  lastNations = nations;
  if (world) lastWorld = world;
  const container = el("nations");
  container.innerHTML = "";
  Object.entries(nations).forEach(([name, meta]) => {
    const color = colorFor(name);
    const card = document.createElement("div");
    card.className = "nation";
    card.style.setProperty("--nc", color);
    const goals = Object.entries(meta.goals || {})
      .filter(([, v]) => v)
      .map(([k, v]) => `<li><b>${k}:</b> ${v}</li>`)
      .join("");
    card.innerHTML = `
      <div class="name">${name}</div>
      <div class="model">${meta.provider || "ollama"} · ${meta.model}</div>
      <div class="stat"><span>${t("resources")}</span><b data-f="resources">-</b></div>
      <div class="stat"><span>${t("cities")}</span><b data-f="cities">0</b></div>
      <div class="stat"><span>${t("units")}</span><b data-f="units">0</b></div>
      <div class="stat"><span>${t("score")}</span><b data-f="score">0</b></div>
      <div class="stat"><span>${t("goal_progress")}</span><b data-f="goal">0%</b></div>
      <div class="terr" data-f="terr"></div>
      <ul class="goals">${goals}</ul>
    `;
    container.appendChild(card);
    nationEls[name] = card;
  });
  if (world) updateWorld(world);
}

function updateWorld(world) {
  lastWorld = world;
  el("turn").textContent = world.turn;
  Object.entries(world.agents || {}).forEach(([name, a]) => {
    const card = nationEls[name];
    if (!card) return;
    card.classList.toggle("eliminated", !a.alive);
    const set = (field, value) => {
      const node = card.querySelector('[data-f="' + field + '"]');
      if (node) node.textContent = value;
    };
    set("resources", a.resources_total);
    set("cities", (a.cities || []).length);
    set("units", a.unit_count || 0);
    set("score", Math.round((world.scores && world.scores[name]) || 0));
    set(
      "goal",
      Math.round(((world.goal_completion && world.goal_completion[name]) || 0) * 100) + "%"
    );
    const terr = card.querySelector('[data-f="terr"]');
    if (terr) {
      terr.innerHTML = (a.cities || [])
        .map((c) => `<span class="chip">${c}</span>`)
        .join("");
    }
  });
  renderHexMap(world);
  const rel = world.relations || {};
  const keys = Object.keys(rel);
  el("relations").innerHTML = keys.length
    ? keys.map(k => {
        const [a, b] = k.split("|");
        const v = rel[k];
        const c = v < -20 ? "var(--danger)" : v > 20 ? "var(--ok)" : "var(--muted)";
        return `<div class="rel">${a} / ${b}<b style="color:${c}">${v}</b></div>`;
      }).join("")
    : `<div class="rel" style="grid-column:1/-1">${t("no_interactions")}</div>`;
}

function clearThinking() {
  Object.values(nationEls).forEach(c => c.classList.remove("thinking"));
}

function handle(event) {
  switch (event.type) {
    case "init":
      renderNations(event.nations, event.world);
      setStatus("status_running", "running");
      log(t("sim_started", event.max_turns), "system");
      break;
    case "turn_start":
      clearThinking();
      log(t("turn_n", event.turn), "turn");
      el("turn").textContent = event.turn;
      break;
    case "agent_thinking": {
      const card = nationEls[event.agent];
      if (card) card.classList.add("thinking");
      break;
    }
    case "llm_start":
      startThink(event.agent, event.node);
      break;
    case "llm_token":
      appendThink(event.agent, event.node, event.text || "");
      break;
    case "llm_end":
      endThink(event.agent, event.node);
      break;
    case "agent_action": {
      clearThinking();
      const color = colorFor(event.agent);
      const a = event.action || {};
      const args = a.args || {};
      const shown = Object.entries(args)
        .filter(([k]) => k !== "reason")
        .map(([k, v]) => `${k}=${v}`)
        .join(", ");
      const reason = args.reason ? `<div class="res">${t("reason", args.reason)}</div>` : "";
      log(
        `<div class="head"><span class="who" style="color:${color}">${event.agent}</span>` +
        `<span class="act">${actionLabel(a.action || "?")}</span></div>` +
        (shown ? `<div class="res">${shown}</div>` : "") +
        reason +
        `<div class="res">${event.result || ""}</div>`,
        ""
      );
      break;
    }
    case "world_state":
      updateWorld(event.world);
      break;
    case "standings":
      break;
    case "interrupted": {
      setStatus("status_interrupted", "done");
      clearThinking();
      log(t("sim_interrupted"), "system");
      if (source) { source.close(); source = null; }
      setRunning(false);
      break;
    }
    case "end": {
      setStatus("status_finished", "done");
      clearThinking();
      const w = event.world;
      const rows = event.rankings.map(([n, s]) =>
        `<div>${n}: ${Math.round(s)} pts ${w.agents[n].alive ? "" : t("eliminated")}</div>`
      ).join("");
      log(
        `<div class="final"><div>${t("sim_ended")}</div>` +
        `<div class="winner" style="color:${colorFor(event.winner)}">${event.winner || t("no_winner")}</div>` +
        rows + `</div>`,
        "system"
      );
      if (source) { source.close(); source = null; }
      setRunning(false);
      break;
    }
    case "error":
      setStatus("status_error", "error");
      log(event.message, "error");
      if (source) { source.close(); source = null; }
      setRunning(false);
      break;
  }
}

async function start() {
  if (source) return;
  const maxTurns = parseInt(el("maxturns").value || "10", 10);
  const params = new URLSearchParams({ max_turns: maxTurns, lang: lang });
  SLUGS.forEach(([slug]) => {
    const select = el("sel-" + slug);
    params.set(slug, select ? select.value : "ollama");
  });
  clearLog();
  setStatus("status_connecting", "running");
  setRunning(true);

  const keys = collectApiKeys();
  if (Object.keys(keys).length) {
    try {
      const res = await fetch("/api/keys", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keys }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (data.providers) { providerInfo = data.providers; updateKeyBadges(); updateKeyWarning(); }
    } catch (err) {
      setStatus("status_error", "error");
      log(t("keys_save_failed", err.message), "error");
      setRunning(false);
      return;
    }
  }

  source = new EventSource(`/api/run?${params.toString()}`);
  source.onmessage = (e) => {
    if (!e.data) return;
    try { handle(JSON.parse(e.data)); } catch (err) { console.error(err, e.data); }
  };
  source.onerror = () => {
    if (source && source.readyState === EventSource.CLOSED) return;
  };
}

el("start").addEventListener("click", start);
el("stop").addEventListener("click", async () => {
  el("stop").disabled = true;
  setStatus("status_stopping", "running");
  try {
    await fetch("/api/stop");
  } catch (err) {
    console.error(err);
  }
});
el("useapi").addEventListener("change", () => { applyToggle(); updateKeyWarning(); });
el("langtoggle").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  applyI18n();
});
el("spectate").addEventListener("click", () => {
  document.body.classList.toggle("spectate");
  applyI18n();
  resetMapView();
});
el("mapreset").addEventListener("click", resetMapView);

const hexmap = el("hexmap");
let hexPan = null;
let hexMoved = false;
hexmap.addEventListener("pointerdown", (e) => {
  hexPan = { x: e.clientX, y: e.clientY, vx: mapView.x, vy: mapView.y };
  hexMoved = false;
  if (hexmap.setPointerCapture) hexmap.setPointerCapture(e.pointerId);
});
hexmap.addEventListener("pointermove", (e) => {
  if (!hexPan) return;
  const dx = e.clientX - hexPan.x;
  const dy = e.clientY - hexPan.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) hexMoved = true;
  const rect = hexmap.getBoundingClientRect();
  const vb = hexmap.viewBox.baseVal;
  const sx = vb.width / (rect.width || 1);
  const sy = vb.height / (rect.height || 1);
  mapView.x = hexPan.vx + dx * sx;
  mapView.y = hexPan.vy + dy * sy;
  applyMapTransform();
});
const endHexPan = () => { hexPan = null; };
hexmap.addEventListener("pointerup", endHexPan);
hexmap.addEventListener("pointercancel", endHexPan);
hexmap.addEventListener("pointerleave", endHexPan);
hexmap.addEventListener(
  "wheel",
  (e) => {
    e.preventDefault();
    const p = svgPoint(e);
    if (!p) return;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const next = Math.max(0.4, Math.min(6, mapView.scale * factor));
    const k = next / mapView.scale;
    mapView.x = p.x - k * (p.x - mapView.x);
    mapView.y = p.y - k * (p.y - mapView.y);
    mapView.scale = next;
    applyMapTransform();
  },
  { passive: false }
);
hexmap.addEventListener("click", (e) => {
  if (hexMoved) return;
  const poly = e.target && e.target.closest ? e.target.closest("polygon") : null;
  if (!poly) return;
  const q = parseInt(poly.getAttribute("data-q"), 10);
  const r = parseInt(poly.getAttribute("data-r"), 10);
  if (!isNaN(q) && !isNaN(r)) showHexInfo(q, r);
});

applyI18n();
loadProviders();
</script>
